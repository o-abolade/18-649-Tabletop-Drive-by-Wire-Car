CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CAN=y
CONFIG_PWM=y
CONFIG_WATCHDOG=y

CONFIG_PRINTK=y
CONFIG_LOG=y

# Console shell, plus `can show can@0` / `can show can@1` for debugging
CONFIG_SHELL=y
CONFIG_CAN_SHELL=y

# Part 3 WCET measurement (common/zephyr/wcet.c): per-thread run time,
# peak run of the MCP2515 driver threads (found by name)
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ANALYSIS=y
CONFIG_THREAD_NAME=y

# Lab 5: Raft debug lines at boot overflowed the default 1 KB log buffer
CONFIG_LOG_BUFFER_SIZE=8192
