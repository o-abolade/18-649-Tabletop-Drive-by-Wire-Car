<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle monitor</title>
<style>
:root {
  --bg: #f3f5f8; --card: #ffffff; --ink: #1d2733; --muted: #5d6b7c; --line: #dde2e9;
  --ok: #1e7a3c; --ok-bg: #e3f4e8; --bad: #b3261e; --bad-bg: #fbe5e3;
  --warn-bg: #fff4d6; --warn: #7a5600; --accent: #17365d; --badge: #e6edf6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --card: #1b2129; --ink: #e4e9ef; --muted: #9aa7b6; --line: #2c3540;
    --ok: #6fd08c; --ok-bg: #173523; --bad: #ff8a80; --bad-bg: #3d1a18;
    --warn-bg: #3a2f10; --warn: #f3cf6d; --accent: #8fb3e6; --badge: #24303e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.45 system-ui, "Segoe UI", Arial, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
         background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; color: var(--accent); }
header .conn { font-size: 12px; color: var(--muted); }
header .spacer { flex: 1; }
button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line);
         background: var(--card); color: var(--ink); cursor: pointer; }
main { max-width: 1100px; margin: 0 auto; padding: 16px 20px 40px; }
#stale { display: none; margin-bottom: 14px; padding: 10px 14px; border-radius: 8px;
         background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.stale .live { opacity: 0.45; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
     margin: 18px 0 8px; }
.nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.node-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.node-name { font-weight: 600; font-size: 15px; }
.node-id { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.up { background: var(--ok-bg); color: var(--ok); }
.down { background: var(--bad-bg); color: var(--bad); }
.badges { margin-top: 8px; min-height: 22px; }
.badge { display: inline-block; margin-right: 6px; padding: 2px 8px; border-radius: 6px;
         background: var(--badge); color: var(--accent); font-size: 12px; font-weight: 600; }
.buses { display: flex; gap: 8px; margin-top: 10px; }
.bus { flex: 1; text-align: center; padding: 6px 0; border-radius: 6px; font-size: 13px; font-weight: 600; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.fig .v { font-size: 26px; font-weight: 650; }
.fig .k { color: var(--muted); font-size: 12px; }
table { width: 100%; border-collapse: collapse; background: var(--card);
        border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
th { color: var(--muted); font-weight: 600; background: var(--bg); }
td.num { font-variant-numeric: tabular-nums; }
tr.replayed td { background: var(--warn-bg); }
.tag { font-size: 11px; font-weight: 700; color: var(--warn); }
.muted { color: var(--muted); }
@media (max-width: 600px) { main { padding: 12px 16px 32px; } .hide-sm { display: none; } }
</style>
</head>
<body>
<header>
  <h1>18-649 vehicle monitor</h1>
  <span class="conn" id="conn">connecting…</span>
  <span class="spacer"></span>
  <button id="clear" title="After a full cold restart of the vehicle its log starts again at 1">Clear log</button>
  <form method="post" action="/logout" style="margin:0"><button type="submit">Sign out</button></form>
</header>
<main id="main">
  <div id="stale"></div>

  <div class="live">
    <h2>Nodes, buses, leader and time master</h2>
    <div class="nodes" id="nodes"></div>

    <h2>Raft and time sync</h2>
    <div class="figures" id="figures"></div>
  </div>

  <h2>Committed log <span class="muted" id="logcount"></span></h2>
  <table>
    <thead><tr><th>Index</th><th>Term</th><th>Event</th><th class="hide-sm">Global time (s)</th>
      <th class="hide-sm">Published</th><th></th></tr></thead>
    <tbody id="log"></tbody>
  </table>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clock = (ms) => ms ? new Date(Number(ms)).toLocaleTimeString() : "–";

function render(s) {
  const hb = s.heartbeat || {};
  const st = s.state || {};
  const leader = Number(hb.leader || 0);

  // Staleness: the Pi is the only uplink, so the GUI freezes while it is down
  document.body.classList.toggle("stale", s.stale);
  $("stale").style.display = s.stale ? "block" : "none";
  $("stale").textContent = hb.wall_ms
    ? `STALE: no data from the vehicle since ${clock(hb.wall_ms)} (${Math.round((s.age_ms || 0) / 1000)} s ago). ` +
      `The cockpit is the only uplink; the last known state is shown greyed out.`
    : "STALE: no data from the vehicle yet.";

  // Views 1-3: nodes alive/dead, bus A/B per node, leader and time master
  $("nodes").innerHTML = (st.nodes || []).map((n) => {
    const bus = (b) => `<div class="bus ${n.up && n[b] ? "up" : "down"}">Bus ${b} ${n.up && n[b] ? "up" : "down"}</div>`;
    const badges = n.id === leader ? '<span class="badge">LEADER</span><span class="badge">TIME MASTER</span>' : "";
    return `<div class="card">
      <div class="node-head"><span><span class="node-name">${esc(n.name)}</span>
        <span class="node-id">N${n.id}</span></span>
        <span class="pill ${n.up ? "up" : "down"}">${n.up ? "alive" : "dead"}</span></div>
      <div class="badges">${badges}</div>
      <div class="buses">${bus("A")}${bus("B")}</div></div>`;
  }).join("") || '<div class="muted">No state received yet.</div>';

  // View 4: held events, plus Raft and sync figures
  const fig = (k, v) => `<div class="card fig"><div class="v">${esc(v)}</div><div class="k">${k}</div></div>`;
  $("figures").innerHTML = [
    fig("Events the leader is holding for the cockpit", hb.held ?? "–"),
    fig("Replayed to the cockpit after an outage", hb.replayed ?? "–"),
    fig("Term / commit index", hb.term ? `${hb.term} / ${hb.commit}` : "–"),
    fig("Cockpit failure mode", st.cockpit_ok === undefined ? "–" : (st.cockpit_ok ? "no (2 Hz)" : "YES (4 Hz)")),
    fig("Cockpit time sync (last error, drift)",
        hb.err_us !== undefined ? `${hb.err_us} µs, ${(Number(hb.drift_ppb) / 1000).toFixed(1)} ppm` : "–"),
    fig("Global time (s)", hb.global_us ? (Number(hb.global_us) / 1e6).toFixed(3) : "–"),
  ].join("");

  // View 5: the committed log, replayed entries marked
  $("logcount").textContent = `(${s.log_total} entries, newest first)`;
  $("log").innerHTML = s.log.map((e) => `<tr class="${e.replayed === "1" ? "replayed" : ""}">
      <td class="num">${esc(e.index)}</td><td class="num">${esc(e.term)}</td><td>${esc(e.type)}</td>
      <td class="num hide-sm">${e.global_us ? (Number(e.global_us) / 1e6).toFixed(3) : ""}</td>
      <td class="hide-sm">${clock(e.wall_ms)}</td>
      <td>${e.replayed === "1" ? '<span class="tag">REPLAYED</span>' : ""}</td></tr>`).join("");
}

function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { $("conn").textContent = "live"; };
  ws.onmessage = (m) => render(JSON.parse(m.data));
  ws.onclose = (ev) => {
    if (ev.code === 4401) { location.href = "/login"; return; }
    $("conn").textContent = "reconnecting…";
    setTimeout(connect, 2000);
  };
}

$("clear").onclick = async () => {
  if (!confirm("Delete the mirrored log? Do this only after a full cold restart of the vehicle.")) return;
  await fetch("/api/clear", { method: "POST" });
};

connect();
</script>
</body>
</html>
