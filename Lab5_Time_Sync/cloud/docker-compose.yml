# Lab 5 extra credit: the cloud node. Redis + the monitor web app + Caddy (HTTPS).
# Secrets come from .env (written by install_vm.sh, mode 600). Nothing but
# Caddy is reachable from the internet:
#   - Redis listens on the VM's 127.0.0.1 only, with a password. The Pi
#     reaches it through an SSH tunnel (user vtunnel, port forwarding only).
#   - The web app is reachable only through Caddy, which serves HTTPS with an
#     automatic Let's Encrypt certificate for $SITE (<ip>.sslip.io).
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  web:
    build: ./web
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      GUI_USER: "${GUI_USER}"
      GUI_PASSWORD: "${GUI_PASSWORD}"
      SECRET_KEY: "${SECRET_KEY}"
      COOKIE_SECURE: "1"
    depends_on:
      - redis
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE: "${SITE}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  redis-data: {}
  caddy-data: {}
  caddy-config: {}
