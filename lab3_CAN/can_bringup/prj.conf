CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CAN=y

CONFIG_PRINTK=y
CONFIG_LOG=y
# Prints the MCP2515 bit-timing (prescaler/BS1/BS2) chosen at init
CONFIG_CAN_LOG_LEVEL_DBG=y

# Shell gives `can send/start/stop/mode/show` for poking the controllers by hand
CONFIG_SHELL=y
CONFIG_CAN_SHELL=y
CONFIG_DEVICE_SHELL=y
